  <body>
    <div id="root"></div>

    <!-- ── 상단 툴바 ─────────────────────────────────────── -->
    <div id="mm-bar" style="
      position:fixed; top:10px; right:14px; z-index:9000;
      display:flex; align-items:center; gap:6px;
      font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    ">
      <span id="mm-user" style="
        background:rgba(30,41,59,0.95); border:1px solid #334155;

      "></span>
      <button onclick="mmOpenPw()" title="비밀번호 변경" style="
        background:rgba(30,41,59,0.95); border:1px solid #334155;
        color:#f1f5f9; padding:5px 10px; border-radius:8px; font-size:14px; cursor:pointer;
      ">🔑</button>
      <button onclick="mmOpenAudit()" title="감사 로그" style="
        background:rgba(30,41,59,0.95); border:1px solid #334155;
        color:#f1f5f9; padding:5px 10px; border-radius:8px; font-size:14px; cursor:pointer;
      ">📋</button>
      <button onclick="mmLogout()" style="
        background:rgba(30,41,59,0.95); border:1px solid #334155;
        color:#ef4444; padding:5px 12px; border-radius:8px; font-size:13px;
        font-weight:600; cursor:pointer;
      ">로그아웃</button>
    </div>

    <!-- ── 비밀번호 변경 모달 ─────────────────────────────── -->
    <div id="mm-pw-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
      z-index:9100; align-items:center; justify-content:center;
      font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
      <div style="background:#1e293b; border:1px solid #334155; border-radius:14px;
        padding:36px 32px; width:320px;">
        <h3 style="color:#f1f5f9; margin:0 0 6px; font-size:17px;">비밀번호 변경</h3>
        <p id="mm-pw-desc" style="color:#94a3b8; font-size:13px; margin:0 0 20px;"></p>
        <div id="mm-pw-err" style="display:none; background:#7f1d1d; border:1px solid #dc2626;
          color:#fca5a5; padding:8px 12px; border-radius:6px; font-size:12px; margin-bottom:12px;"></div>
        <input id="mm-pw-new" type="password" placeholder="새 비밀번호" style="
          width:100%; padding:10px 12px; background:#0f172a; border:1px solid #334155;
          border-radius:8px; color:#f1f5f9; font-size:14px; outline:none; margin-bottom:10px;">
        <input id="mm-pw-confirm" type="password" placeholder="새 비밀번호 확인" style="
          width:100%; padding:10px 12px; background:#0f172a; border:1px solid #334155;
          border-radius:8px; color:#f1f5f9; font-size:14px; outline:none; margin-bottom:20px;">
        <div style="display:flex; gap:8px;">
          <button id="mm-pw-cancel" style="flex:1; padding:10px; background:#334155;
            color:#f1f5f9; border:none; border-radius:8px; font-size:14px; cursor:pointer;">취소</button>
          <button onclick="mmSavePw()" style="flex:2; padding:10px; background:#3b82f6;
            color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">변경하기</button>
        </div>
      </div>
    </div>

    <!-- ── 감사 로그 모달 ─────────────────────────────────── -->
    <div id="mm-audit-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8);
      z-index:9100; align-items:center; justify-content:center;
      font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
      <div style="background:#1e293b; border:1px solid #334155; border-radius:14px;
        width:780px; max-width:95vw; max-height:82vh; display:flex; flex-direction:column; overflow:hidden;">
        <!-- 헤더 -->
        <div style="padding:22px 26px 0; border-bottom:1px solid #334155; flex-shrink:0;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h3 style="color:#f1f5f9; margin:0; font-size:17px;">🔐 감사 로그</h3>
            <button onclick="mmCloseAudit()" style="background:#334155; border:none;
              color:#94a3b8; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13px;">닫기</button>
          </div>
          <!-- 비밀번호 입력 섹션 -->
          <div id="mm-audit-pw-sec" style="margin-bottom:14px;">
            <div style="display:flex; gap:8px;">
              <input id="mm-audit-pw" type="password" placeholder="관리자 비밀번호" style="
                flex:1; padding:9px 12px; background:#0f172a; border:1px solid #334155;
                border-radius:8px; color:#f1f5f9; font-size:14px; outline:none;">
              <button onclick="mmCheckAuditPw()" style="padding:9px 16px; background:#3b82f6;
                color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer;">확인</button>
            </div>
            <div id="mm-audit-pw-err" style="display:none; color:#ef4444; font-size:12px; margin-top:6px;"></div>
          </div>
        </div>
        <!-- 로그 목록 -->
        <div id="mm-audit-content" style="display:none; flex:1; overflow-y:auto; padding:0 26px 22px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin:14px 0 10px;">
            <span id="mm-audit-count" style="color:#64748b; font-size:13px;"></span>
            <button onclick="mmClearLogs()" style="background:#7f1d1d; border:none; color:#fca5a5;
              padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12px;">로그 초기화</button>
          </div>
          <table style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead>
              <tr style="border-bottom:1px solid #334155;">
                <th style="padding:9px 8px; color:#64748b; text-align:left; font-weight:500; white-space:nowrap;">시간</th>
                <th style="padding:9px 8px; color:#64748b; text-align:left; font-weight:500;">사번</th>
                <th style="padding:9px 8px; color:#64748b; text-align:left; font-weight:500;">이름</th>
                <th style="padding:9px 8px; color:#64748b; text-align:left; font-weight:500;">행동</th>
                <th style="padding:9px 8px; color:#64748b; text-align:left; font-weight:500;">상세</th>
              </tr>
            </thead>
            <tbody id="mm-audit-tbody"></tbody>
          </table>
          <div id="mm-audit-empty" style="display:none; text-align:center; padding:40px; color:#64748b;">로그 기록이 없습니다.</div>
        </div>
      </div>
    </div>

    <script>
    const PFX = 'metamEdu_';
    const AUDIT_PW = '7256!';

    // ── 현재 사용자 확인 ──────────────────────────────────
    let mmUser = null;
    try {
      mmUser = JSON.parse(localStorage.getItem(PFX + 'currentUser') || 'null');
    } catch(e) {}

    // 로그인 안 된 상태면 login.html로 이동
    if (!mmUser) {
      location.replace('./login.html');
    } else {
      document.getElementById('mm-user').textContent = mmUser.name + ' (' + mmUser.id + ')';
    }

    // ── 감사로그 기록 ──────────────────────────────────────
    function mmLog(action, detail) {
      if (!mmUser) return;
      try {
        const logs = JSON.parse(localStorage.getItem(PFX + 'auditLogs') || '[]');
        logs.unshift({
          ts: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }),
          id: mmUser.id, name: mmUser.name, action, detail: detail || ''
        });
        if (logs.length > 500) logs.splice(500);
        localStorage.setItem(PFX + 'auditLogs', JSON.stringify(logs));
      } catch(e) {}
    }

    // ── 교육 추가/수정/삭제 alert 후킹 ───────────────────
    const _origAlert = window.alert;
    window.alert = function(msg) {
      if (mmUser && typeof msg === 'string') {
        if (msg.includes('추가')) mmLog('교육 추가', msg);
        else if (msg.includes('수정')) mmLog('교육 수정', msg);
        else if (msg.includes('삭제')) mmLog('교육 삭제', msg);
      }
      return _origAlert.apply(this, arguments);
    };

    // ── 로그아웃 ──────────────────────────────────────────
    function mmLogout() {
      mmLog('로그아웃');
      localStorage.removeItem(PFX + 'currentUser');
      // 자동 로그인 해제 (체크 안 된 경우)
      if (localStorage.getItem(PFX + 'autoLogin') !== '1') {
        localStorage.removeItem(PFX + 'autoLoginUser');
      }
      location.replace('./login.html');
    }

    // ── 비밀번호 변경 ─────────────────────────────────────
    function mmOpenPw() {
      document.getElementById('mm-pw-desc').textContent = '새 비밀번호를 입력하세요.';
      document.getElementById('mm-pw-new').value = '';
      document.getElementById('mm-pw-confirm').value = '';
      document.getElementById('mm-pw-err').style.display = 'none';
      document.getElementById('mm-pw-cancel').style.display = '';
      document.getElementById('mm-pw-modal').style.display = 'flex';
    }
    document.getElementById('mm-pw-cancel').addEventListener('click', () => {
      document.getElementById('mm-pw-modal').style.display = 'none';
    });
    function mmSavePw() {
      const np = document.getElementById('mm-pw-new').value;
      const cp = document.getElementById('mm-pw-confirm').value;
      const errEl = document.getElementById('mm-pw-err');
      errEl.style.display = 'none';
      if (!np) { errEl.textContent = '새 비밀번호를 입력하세요.'; errEl.style.display = 'block'; return; }
      if (np !== cp) { errEl.textContent = '비밀번호가 일치하지 않습니다.'; errEl.style.display = 'block'; return; }
      localStorage.setItem(PFX + 'pw_' + mmUser.id, np);
      mmLog('비밀번호 변경', '사번: ' + mmUser.id);
      document.getElementById('mm-pw-modal').style.display = 'none';
      alert('비밀번호가 변경되었습니다!');
    }

    // ── 감사 로그 ─────────────────────────────────────────
    function mmOpenAudit() {
      document.getElementById('mm-audit-pw-sec').style.display = 'block';
      document.getElementById('mm-audit-content').style.display = 'none';
      document.getElementById('mm-audit-pw').value = '';
      document.getElementById('mm-audit-pw-err').style.display = 'none';
      document.getElementById('mm-audit-modal').style.display = 'flex';
      mmLog('감사로그 열기 시도');
    }
    function mmCloseAudit() {
      document.getElementById('mm-audit-modal').style.display = 'none';
    }
    function mmCheckAuditPw() {
      const pw = document.getElementById('mm-audit-pw').value;
      if (pw === AUDIT_PW) {
        document.getElementById('mm-audit-pw-sec').style.display = 'none';
        document.getElementById('mm-audit-content').style.display = 'block';
        mmLog('감사로그 열기 성공');
        mmRenderLogs();
      } else {
        document.getElementById('mm-audit-pw-err').textContent = '비밀번호가 올바르지 않습니다.';
        document.getElementById('mm-audit-pw-err').style.display = 'block';
        mmLog('감사로그 비밀번호 오류');
      }
    }
    document.getElementById('mm-audit-pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') mmCheckAuditPw();
    });
    function mmRenderLogs() {
      const logs = JSON.parse(localStorage.getItem(PFX + 'auditLogs') || '[]');
      const tbody = document.getElementById('mm-audit-tbody');
      document.getElementById('mm-audit-count').textContent = '총 ' + logs.length + '개의 로그';
      if (logs.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('mm-audit-empty').style.display = 'block';
        return;
      }
      document.getElementById('mm-audit-empty').style.display = 'none';
      const colors = { '로그인':'#22c55e','자동 로그인':'#10b981','로그아웃':'#f59e0b',
        '비밀번호 변경':'#3b82f6','교육 추가':'#10b981','교육 수정':'#f59e0b','교육 삭제':'#ef4444',
        '감사로그 열기 성공':'#06b6d4','감사로그 열기 시도':'#a78bfa','감사로그 비밀번호 오류':'#dc2626','로그 초기화':'#dc2626' };
      tbody.innerHTML = logs.map((log, i) => {
        const c = Object.entries(colors).find(([k]) => log.action.includes(k))?.[1] || '#94a3b8';
        return '<tr style="border-bottom:1px solid #1e293b;' + (i%2?'background:rgba(255,255,255,0.02)':'') + '">'
          + '<td style="padding:8px; color:#64748b; white-space:nowrap; font-size:12px;">' + log.ts + '</td>'
          + '<td style="padding:8px; color:#cbd5e1; font-family:monospace; font-size:13px;">' + log.id + '</td>'
          + '<td style="padding:8px; color:#e2e8f0; font-weight:500;">' + log.name + '</td>'
          + '<td style="padding:8px;"><span style="background:' + c + '22; color:' + c + '; padding:2px 8px; border-radius:4px; font-size:12px;">' + log.action + '</span></td>'
          + '<td style="padding:8px; color:#64748b; font-size:12px; max-width:200px; word-break:break-all;">' + (log.detail||'-') + '</td>'
          + '</tr>';
      }).join('');
    }
    function mmClearLogs() {
      // 구혜린(2024100098) 계정만 로그 초기화 가능
      if (mmUser.id !== '2024100098') {
        alert('감사로그 초기화는 관리자만 가능합니다.');
        return;
      }
      if (confirm('감사로그를 초기화하시겠습니까?')) {
        const cnt = JSON.parse(localStorage.getItem(PFX + 'auditLogs') || '[]').length;
        mmLog('로그 초기화', '초기화 전 ' + cnt + '개');
        localStorage.setItem(PFX + 'auditLogs', '[]');
        mmRenderLogs();
      }
    }
    </script>

    <!-- 커스텀 UI 수정 스크립트 -->
    <script>
    (function() {
      // 현재 필터 상태 (초기값: 없음 - 아무것도 파란색 아님)
      var currentFilter = null;

      function waitForReact() {
        var debounce = null;
        var observer = new MutationObserver(function() {
          clearTimeout(debounce);
          debounce = setTimeout(applyCustomizations, 150);
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(applyCustomizations, 800);
        setTimeout(applyCustomizations, 2000);
        setTimeout(applyCustomizations, 4000);
      }

      function applyCustomizations() {
        removeRegularBtn();
        addFilterBtns();
        attachListeners();
        addBackupBtn();
        if (currentFilter) {
          filterRows(currentFilter);
          updateActive(currentFilter);
        }
      }

      // ① 정규 버튼 제거
      function removeRegularBtn() {
        document.querySelectorAll('button').forEach(function(btn) {
          var t = btn.textContent.trim();
          if (t === '정규' || t === '정규과정') btn.remove();
        });
      }

      // ② 신입/기존 버튼 추가
      function addFilterBtns() {
        var buttons = Array.from(document.querySelectorAll('button'));
        var allBtn = buttons.find(function(b) { return b.textContent.trim() === '전체'; });
        if (!allBtn) return;
        var parent = allBtn.parentElement;
        if (!parent) return;
        var parentBtns = Array.from(parent.querySelectorAll('button'));
        var hasNewbie = parentBtns.some(function(b) { return b.textContent.trim() === '신입'; });
        var hasExisting = parentBtns.some(function(b) { return b.textContent.trim() === '기존'; });
        if (!hasNewbie) {
          var nb = document.createElement('button');
          nb.textContent = '신입';
          nb.className = allBtn.className;
          nb.setAttribute('data-custom', 'newbie');
          allBtn.after(nb);
        }
        if (!hasExisting) {
          var nb2 = parent.querySelector('[data-custom="newbie"]') ||
            Array.from(parent.querySelectorAll('button')).find(function(b) { return b.textContent.trim() === '신입'; });
          if (nb2) {
            var eb = document.createElement('button');
            eb.textContent = '기존';
            eb.className = allBtn.className;
            eb.setAttribute('data-custom', 'existing');
            nb2.after(eb);
          }
        }
      }

      // ③ 버튼 이벤트 연결
      function attachListeners() {
        document.querySelectorAll('button').forEach(function(btn) {
          var t = btn.textContent.trim();
          if (['신입','기존','특강','관리자'].indexOf(t) > -1) {
            btn.onclick = function(e) {
              e.stopPropagation();
              currentFilter = t;
              filterRows(t);
              updateActive(t);
            };
          }
          if (t === '전체') {
            btn.onclick = function(e) {
              e.stopPropagation();
              currentFilter = null;
              showAll();
              updateActive(null);
            };
          }
        });
      }

      // ④ 행 필터링
      function filterRows(type) {
        document.querySelectorAll('table tbody tr').forEach(function(row) {
          var cells = row.querySelectorAll('td');
          var matched = false;
          cells.forEach(function(cell) {
            if (cell.textContent.trim() === type) matched = true;
          });
          row.style.display = matched ? '' : 'none';
        });
      }

      function showAll() {
        document.querySelectorAll('table tbody tr').forEach(function(row) {
          row.style.display = '';
        });
      }

      // ⑤ 버튼 색상: 클릭한 것만 파란색, 초기엔 모두 흰색
      function updateActive(label) {
        document.querySelectorAll('button').forEach(function(btn) {
          var t = btn.textContent.trim();
          if (['전체','신입','기존','특강','관리자'].indexOf(t) > -1) {
            if (label && t === label) {
              btn.style.setProperty('background-color', '#2563eb', 'important');
              btn.style.setProperty('color', 'white', 'important');
              btn.style.setProperty('border-color', '#2563eb', 'important');
            } else {
              btn.style.removeProperty('background-color');
              btn.style.removeProperty('color');
              btn.style.removeProperty('border-color');
            }
          }
        });
      }

      // ⑥ 백업 버튼 추가
      function addBackupBtn() {
        var recordHeader = Array.from(document.querySelectorAll('h2')).find(function(h) {
          return h.textContent.trim() === '교육 기록';
        });
        if (!recordHeader) return;
        if (document.querySelector('[data-backup-btn]')) return;
        var btn = document.createElement('button');
        btn.textContent = '📥 전체 백업 다운로드';
        btn.setAttribute('data-backup-btn', 'true');
        btn.style.cssText = 'padding:5px 10px;background:#059669;color:white;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;margin-top:8px;display:block;';
        btn.onmouseover = function() { btn.style.background = '#047857'; };
        btn.onmouseout = function() { btn.style.background = '#059669'; };
        btn.onclick = function(e) { e.stopPropagation(); downloadExcel(); };
        recordHeader.parentNode.insertBefore(btn, recordHeader.nextSibling);
      }

      // ⑦ 엑셀 다운로드
      function downloadExcel() {
        // 테이블 데이터 수집
        // 컬럼 순서: 유형(0), 날짜(1), 센터(2), 강사(3), 과정명(4), 방식(5), 인원(6), 시간(7), 관리(8)
        var rows = Array.from(document.querySelectorAll('table tbody tr'));
        var data = [];
        rows.forEach(function(row) {
          var cells = Array.from(row.querySelectorAll('td'));
          if (cells.length > 0) {
            data.push(cells.map(function(c) { return c.textContent.trim(); }));
          }
        });
        if (data.length === 0) { alert('백업할 데이터가 없습니다.'); return; }

        var thCells = Array.from(document.querySelectorAll('table thead th'));
        var headers = thCells.map(function(th) { return th.textContent.trim(); });

        function pad(n) { return String(n).padStart(2,'0'); }
        function esc(v) { return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        // 강사 순서 고정
        var instrOrder = ['김보경','김현정','나혜리','구혜린'];

        // 강사별 월별 집계
        // row[3]=강사, row[1]=날짜(2026-05-27), row[7]=시간, row[6]=인원
        var instrMonthMap = {};
        var allMonths = {};
        data.forEach(function(row) {
          var instr = row[3] || '미배정';
          var dateStr = row[1] || '';
          var mMatch = String(dateStr).match(/(\d{4})-(\d{2})/);
          var monthKey = mMatch ? (mMatch[1] + '-' + mMatch[2]) : '미상';
          var monthLabel = mMatch ? (parseInt(mMatch[2]) + '월') : '미상';
          if (!instrMonthMap[instr]) instrMonthMap[instr] = {};
          if (!instrMonthMap[instr][monthKey]) instrMonthMap[instr][monthKey] = {label:monthLabel, 교육횟수:0, 총시간:0, 총인원:0};
          instrMonthMap[instr][monthKey].교육횟수++;
          instrMonthMap[instr][monthKey].총시간 += parseFloat(row[7]) || 0;
          instrMonthMap[instr][monthKey].총인원 += parseInt(row[6]) || 0;
          allMonths[monthKey] = monthLabel;
        });

        var sortedMonthKeys = Object.keys(allMonths).sort();

        // 강사 순서 정렬
        var allInstrs = Object.keys(instrMonthMap);
        var sortedInstrs = instrOrder.filter(function(n) { return allInstrs.indexOf(n) > -1; });
        allInstrs.forEach(function(n) { if (sortedInstrs.indexOf(n) === -1) sortedInstrs.push(n); });

        // 강사별현황 가로 레이아웃
        // 행1: 빈칸 | 강사명 | '' | '' | '' | 강사명 | ...
        // 행2: 월   | 월    | 총교육시간(H) | 교육횟수 | 총교육인원(명) | 반복
        // 행3~: 월별 데이터
        // 마지막: 합계

        var instrSheetData = [];

        // 강사 이름 행
        var nameRow = [''];
        sortedInstrs.forEach(function(instr) {
          nameRow.push(instr); nameRow.push(''); nameRow.push(''); nameRow.push('');
        });
        instrSheetData.push(nameRow);

        // 항목 헤더 행
        var itemRow = ['월'];
        sortedInstrs.forEach(function() {
          itemRow.push('총교육시간(H)'); itemRow.push('교육횟수'); itemRow.push('총교육인원(명)'); itemRow.push('');
        });
        instrSheetData.push(itemRow);

        // 월별 데이터
        sortedMonthKeys.forEach(function(mk) {
          var row = [allMonths[mk]];
          sortedInstrs.forEach(function(instr) {
            var d = instrMonthMap[instr] && instrMonthMap[instr][mk];
            if (d) {
              row.push(d.총시간); row.push(d.교육횟수); row.push(d.총인원); row.push('');
            } else {
              row.push('-'); row.push('-'); row.push('-'); row.push('');
            }
          });
          instrSheetData.push(row);
        });

        // 합계 행
        var totalRow = ['합계'];
        sortedInstrs.forEach(function(instr) {
          var t = {교육횟수:0, 총시간:0, 총인원:0};
          sortedMonthKeys.forEach(function(mk) {
            if (instrMonthMap[instr] && instrMonthMap[instr][mk]) {
              t.교육횟수 += instrMonthMap[instr][mk].교육횟수;
              t.총시간 += instrMonthMap[instr][mk].총시간;
              t.총인원 += instrMonthMap[instr][mk].총인원;
            }
          });
          totalRow.push(t.총시간); totalRow.push(t.교육횟수); totalRow.push(t.총인원); totalRow.push('');
        });
        instrSheetData.push(totalRow);

        // 센터별 집계
        var centerMap = {};
        data.forEach(function(row) {
          var c = row[2] || '미배정';
          if (!centerMap[c]) centerMap[c] = {교육횟수:0, 총시간:0, 총인원:0};
          centerMap[c].교육횟수++;
          centerMap[c].총시간 += parseFloat(row[7]) || 0;
          centerMap[c].총인원 += parseInt(row[6]) || 0;
        });
        var centerData = Object.entries(centerMap).map(function(e) {
          return [e[0], e[1].교육횟수, e[1].총시간, e[1].총인원];
        });

        var now = new Date();
        var filename = 'MetaM_교육백업_' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '.xls';

        function makeSheet(name, sheetHeaders, sheetData) {
          var xml = '<Worksheet ss:Name="' + esc(name) + '"><Table>';
          xml += '<Row>' + sheetHeaders.map(function(h) {
            return '<Cell ss:StyleID="hd"><Data ss:Type="String">' + esc(String(h)) + '</Data></Cell>';
          }).join('') + '</Row>';
          sheetData.forEach(function(row) {
            xml += '<Row>' + row.map(function(cell) {
              if (cell === '' || cell === undefined) return '<Cell><Data ss:Type="String"></Data></Cell>';
              var num = parseFloat(cell);
              var isNum = !isNaN(num) && String(cell).trim() !== '' && cell !== '-';
              return isNum
                ? '<Cell><Data ss:Type="Number">' + num + '</Data></Cell>'
                : '<Cell><Data ss:Type="String">' + esc(String(cell)) + '</Data></Cell>';
            }).join('') + '</Row>';
          });
          xml += '</Table></Worksheet>';
          return xml;
        }

        var wb = '<?xml version="1.0" encoding="UTF-8"?>'
          + '<?mso-application progid="Excel.Sheet"?>'
          + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" '
          + 'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
          + '<Styles><Style ss:ID="hd"><Font ss:Bold="1"/>'
          + '<Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/></Style></Styles>'
          + makeSheet('교육기록', headers, data)
          + makeSheet('강사별현황', instrSheetData[0], instrSheetData.slice(1))
          + makeSheet('센터별현황', ['센터','교육횟수','총시간(H)','총인원(명)'], centerData)
          + '</Workbook>';

        var blob = new Blob(['\uFEFF' + wb], {type:'application/vnd.ms-excel;charset=utf-8;'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
        alert('백업 완료! ' + filename + ' / 총 ' + data.length + '건 저장');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitForReact);
      } else {
        waitForReact();
      }
    })();
    </script>

  </body>
</html>
