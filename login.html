<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - MetaM 교육 관리 시스템</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 40px;
      width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .header { text-align: center; margin-bottom: 32px; }
    .brand { font-size: 12px; letter-spacing: 5px; color: #475569; text-transform: uppercase; margin-bottom: 10px; }
    .title { font-size: 22px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #64748b; }
    .error-box {
      display: none;
      background: #7f1d1d;
      border: 1px solid #dc2626;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; letter-spacing: 0.5px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #3b82f6; }
    .options {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      margin-top: 4px;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
    }
    .options input[type=checkbox] { width: 15px; height: 15px; accent-color: #3b82f6; cursor: pointer; }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-login:hover { background: #2563eb; }
    .btn-login:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">MetaM</div>
      <div class="title">교육 관리 시스템</div>
      <div class="subtitle">사번과 비밀번호를 입력하세요</div>
    </div>
    <div class="error-box" id="err"></div>
    <div class="field">
      <label>사번 (아이디)</label>
      <input type="text" id="inp-id" placeholder="사번 입력" autocomplete="username">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="inp-pw" placeholder="비밀번호 입력" autocomplete="current-password">
    </div>
    <div class="options">
      <label><input type="checkbox" id="chk-save"> 아이디 저장</label>
      <label><input type="checkbox" id="chk-auto"> 자동 로그인</label>
    </div>
    <button class="btn-login" id="btn-login">로그인</button>
  </div>

  <script>
    const PFX = 'metamEdu_';
    const USERS = {
      '2025090554': '김보경',
      '2022110156': '김현정',
      '2024040972': '나혜리',
      '2024100098': '구혜린'
    };

    function getPw(id) {
      return localStorage.getItem(PFX + 'pw_' + id) || '00000';
    }

    function addLog(userId, userName, action, detail) {
      try {
        const logs = JSON.parse(localStorage.getItem(PFX + 'auditLogs') || '[]');
        logs.unshift({
          ts: new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }),
          id: userId, name: userName, action, detail
        });
        if (logs.length > 500) logs.splice(500);
        localStorage.setItem(PFX + 'auditLogs', JSON.stringify(logs));
      } catch(e) {}
    }

    // 초기값 세팅
    const savedId = localStorage.getItem(PFX + 'savedId') || '';
    if (savedId) {
      document.getElementById('inp-id').value = savedId;
      document.getElementById('chk-save').checked = true;
    }
    if (localStorage.getItem(PFX + 'autoLogin') === '1') {
      document.getElementById('chk-auto').checked = true;
    }

    // 자동 로그인 처리
    const autoId = localStorage.getItem(PFX + 'autoLoginUser');
    if (localStorage.getItem(PFX + 'autoLogin') === '1' && autoId && USERS[autoId]) {
      localStorage.setItem(PFX + 'currentUser', JSON.stringify({ id: autoId, name: USERS[autoId] }));
      addLog(autoId, USERS[autoId], '자동 로그인', `사번: ${autoId}`);
      location.replace('./index.html');
    }

    function doLogin() {
      const id = document.getElementById('inp-id').value.trim();
      const pw = document.getElementById('inp-pw').value;
      const saveId = document.getElementById('chk-save').checked;
      const autoLogin = document.getElementById('chk-auto').checked;
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';

      if (!USERS[id]) {
        errEl.textContent = '존재하지 않는 사번입니다.';
        errEl.style.display = 'block';
        return;
      }
      if (pw !== getPw(id)) {
        errEl.textContent = '비밀번호가 올바르지 않습니다.';
        errEl.style.display = 'block';
        return;
      }

      // 아이디 저장
      if (saveId) localStorage.setItem(PFX + 'savedId', id);
      else localStorage.removeItem(PFX + 'savedId');

      // 자동 로그인 설정
      if (autoLogin) {
        localStorage.setItem(PFX + 'autoLogin', '1');
        localStorage.setItem(PFX + 'autoLoginUser', id);
      } else {
        localStorage.removeItem(PFX + 'autoLogin');
        localStorage.removeItem(PFX + 'autoLoginUser');
      }

      // 현재 사용자 저장
      localStorage.setItem(PFX + 'currentUser', JSON.stringify({ id, name: USERS[id] }));
      addLog(id, USERS[id], '로그인', `아이디저장: ${saveId?'예':'아니오'}, 자동로그인: ${autoLogin?'예':'아니오'}`);

      location.replace('./index.html');
    }

    document.getElementById('btn-login').addEventListener('click', doLogin);
    document.getElementById('inp-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('inp-id').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inp-pw').focus(); });
  </script>
</body>
</html>
